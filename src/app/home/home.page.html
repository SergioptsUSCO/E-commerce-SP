<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Plataforma E-Commerce
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="input">
    <ion-button (click)="abrirModalFiltro()">Filtrar</ion-button>
  </div>

  <ion-modal [isOpen]="modalFiltroAbierto" (didDismiss)="modalFiltroAbierto = false">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Filtrar por rango de precio</ion-title>
          <ion-button slot="end" fill="clear" (click)="modalFiltroAbierto = false">Salir</ion-button>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-label position="floating">Precio mínimo</ion-label>
        <ion-input type="number" [(ngModel)]="precioMinimo" placeholder="Escribe el precio mínimo"></ion-input>
        <ion-label position="floating">Precio máximo</ion-label>
        <ion-input type="number" [(ngModel)]="precioMaximo" placeholder="Escribe el precio máximo"></ion-input>
        <ion-button expand="block" (click)="continuarFiltro()">Continuar</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
  
  <ion-card *ngFor="let orden of ordenesFiltradas">
    <ion-card-header>
      <ion-card-title>{{ orden.title }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Identificador:</strong> {{ orden.id }}</p>
      <p><strong>Usuario:</strong> {{ orden.userId }}</p>
      <p><strong>Precio:</strong> {{ orden.price }}</p>
      <p><strong>Existencias:</strong> {{ orden.stock }}</p>
    </ion-card-content>
  </ion-card>
  
</ion-content>
