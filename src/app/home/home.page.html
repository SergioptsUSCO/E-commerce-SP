<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Plataforma E-Commerce
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="input">
    <ion-label position="floating">Precio máximo</ion-label>
    <ion-input type="number" [(ngModel)]="precioMaximo" placeholder="Filtrar por precio máximo"></ion-input>
    <ion-button (click)="aplicarFiltro()">Aplicar filtro</ion-button>
  </div>
  
  <ion-card *ngFor="let orden of ordenesFiltradas">
    <ion-card-header>
      <ion-card-title>{{ orden.title }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Identificador:</strong> {{ orden.id }}</p>
      <p><strong>Usuario:</strong> {{ orden.userId }}</p>
      <p><strong>Precio:</strong> {{ orden.price }}</p>
      <p><strong>Existencias:</strong> {{ orden.stock }}</p>
    </ion-card-content>
  </ion-card>
  
</ion-content>
